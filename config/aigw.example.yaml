#
# Beispielkonfiguration für `aigw serve --config config/aigw.example.yaml`.
# Alle Felder sind optional; gezeigt sind die Standardwerte.
#
# Jeder Wert lässt sich per Umgebungsvariable überschreiben:
#   AIGW_<ABSCHNITT>__<FELD>, z. B. AIGW_STORE__URL=postgres://aigw@db/aigw
#
# Modelle, Keys, Teams, Plugins usw. stehen NICHT hier, sondern in der Datenbank
# (Admin-API/UI) bzw. als GitOps-Ressourcen (`apiVersion: aigw/v1alpha1`).

# Datenebene (/v1/*, /healthz) und Steuerebene (Admin-API, UI, /healthz).
# Gleiche Adresse → ein gemeinsamer Listener.
server:
  data:
    listen: "127.0.0.1:4000"
    # Maximale Request-Größe (32 MiB); größere Anfragen → 413
    max_body_bytes: 33554432
    # Antwort-Header x-aigw-deployment / x-aigw-attempts / x-aigw-fallback (Routing, AIGW-24/25)
    routing_headers: true
    # Maximale Größe eines Audio-Uploads (/v1/audio/transcriptions und /translations,
    # 25 MiB, AIGW-21); wirksam höchstens max_body_bytes
    max_audio_bytes: 26214400
    # Höchstzahl gleichzeitiger Verbindungen (0 = unbegrenzt); weitere → sofort 503 (S-32)
    max_connections: 10000
  control:
    listen: "127.0.0.1:4001"
    max_connections: 1024
  # Lese-Timeouts und HTTP/2-Grenzen beider Listener (S-32, AIGW-80; 0 = aus). Laufende
  # Antworten (SSE-Streams) brechen sie nicht ab. Details: docs/betrieb/haertung.md
  http:
    # HTTP/1: vom ersten Byte bis zum vollständigen Anfragekopf (Slowloris)
    header_read_timeout_secs: 10
    # Höchste Pause zwischen zwei Teilen des Anfragekörpers
    body_read_timeout_secs: 30
    # Mindestrate des Anfragekörpers (Bytes/s) nach body_read_timeout_secs Vorlauf
    body_min_bytes_per_sec: 1024
    # Keep-Alive-Leerlauf; größer als das Leerlauf-Timeout eines vorgeschalteten Load Balancers
    idle_timeout_secs: 120
    http2_max_concurrent_streams: 256
    http2_keepalive_interval_secs: 30
    http2_keepalive_timeout_secs: 20

store:
  # SQLite (Standard) oder postgres://benutzer@host/datenbank
  url: "sqlite://aigw.db?mode=rwc"
  max_connections: 10
  # Absicherungs-Abfrage der Konfigurationsversion in Sekunden (0 = aus); Änderungen kommen
  # sonst sofort per Benachrichtigung (SQLite im Prozess, Postgres LISTEN/NOTIFY).
  reload_poll_secs: 30

snapshot:
  # Inkrementeller Neubau des Konfigurations-Snapshots (nur geänderte Objekte, F16); bei
  # Lücken, unbekannten oder mehr als max_incremental_changes Änderungen vollständig
  incremental: true
  max_incremental_changes: 1000
  # Konsistenzprüfung: vollständiger Neubau im Hintergrund + Vergleich (Sekunden, 0 = aus)
  verify_interval_secs: 600
  # /readyz meldet "degraded" (HTTP 200), wenn der Snapshot so lange nicht mit der
  # Datenbank abgeglichen werden konnte oder aus dem Platten-Cache stammt (F15)
  stale_after_secs: 300
  # Verschlüsselter Snapshot-Cache (AES-256-GCM, Master-Key) für den Kaltstart bei
  # Datenbankausfall (F14); ohne Angabe aus
  # cache_file: "/var/lib/aigw/snapshot.cache"
  cache_write_interval_secs: 10
  # Höchstalter des Caches für den Kaltstart (Sekunden, 0 = unbegrenzt; AIGW-58)
  cache_max_age_secs: 86400

counters:
  # local | postgres-sync | redis
  backend: local
  # redis_url: "redis://127.0.0.1:6379/0"

secrets:
  # Master-Key (32 Byte, hex oder Base64) für verschlüsselte Zugangsdaten – erzeugen mit
  # `aigw keygen --out /run/secrets/aigw-master-key` (Rechte 0600) oder `aigw keygen` (stdout).
  # Aus Datei oder – ohne Datei – aus der genannten Umgebungsvariable.
  # master_key_file: /run/secrets/aigw-master-key
  master_key_env: AIGW_MASTER_KEY
  # Frühere Keys, nur zum Entschlüsseln während einer Rotation:
  previous_key_files: []

log:
  # Filter wie RUST_LOG
  level: info
  # text | json
  format: text

# Request-Log, Minuten-Rollups und Payload-Logging (docs/konzept/07-beobachtung.md).
observe:
  # Rohlog je Anfrage in der Datenbank (Rollups entstehen immer)
  request_log: true
  # Puffer Proxy → Writer; voll → verwerfen, gezählt als aigw_log_dropped_total
  queue_capacity: 16384
  # Schreiben alle 500 ms oder spätestens bei 1000 Einträgen
  batch_size: 1000
  flush_interval_ms: 500
  shutdown_timeout_ms: 5000
  # off | metadata | masked | full (Header Authorization/api-key/x-api-key nie)
  payload: "off"
  payload_max_bytes: 65536
  retention:
    # 0 = unbegrenzt
    request_log_days: 30
    payload_days: 7
    rollup_days: 400
    sweep_interval_secs: 3600
  jsonl:
    enabled: false
    path: aigw-requests.jsonl
    include_payload: false

# GitOps (docs/konzept/09-gitops.md): `aigw config export|diff|apply|validate`.
gitops:
  # Modus „nur YAML“: Schreibrouten der Admin-API (und damit der UI) antworten mit 403;
  # Änderungen nur per `aigw config apply` bzw. POST /admin/api/v1/config:apply.
  read_only_admin: false
  # valueFrom.file in Manifesten über die Admin-API (POST config:apply) nur aus diesem
  # Verzeichnis (F52; ohne: keine Dateien). Die CLI ist nicht eingeschränkt.
  # secret_dir: /run/aigw/secrets

# Audit-Log (docs/konzept/08-admin-api.md): Hash-Kette gegen Manipulation (immer aktiv,
# Prüfung: `aigw audit verify` bzw. GET /admin/api/v1/audit-log/verify) und Aufbewahrung.
audit:
  # Einträge älter als N Tage löschen (0 = unbegrenzt); die Kette bleibt prüfbar (Anker)
  retention_days: 0
  sweep_interval_secs: 3600

# Ausgehende Verbindungen (Anbieter, Webhooks, MCP, OIDC, Guardrail-Dienste, OTLP;
# docs/konzept/06-streaming-und-anbieter.md §4). Je Deployment zusätzlich settings.caFile.
upstream:
  # Wurzelzertifikate: webpki (Mozilla, eingebettet) | system (Betriebssystem) | both
  roots: webpki
  # zusätzliche CA-Zertifikate (PEM), z. B. eine interne CA
  # ca_file: /etc/aigw/ca.pem
  # Verzeichnis für settings.caFile der Deployments (F177; ohne: settings.caFile verboten)
  # ca_dir: /etc/aigw/ca

# Admin-API (docs/konzept/08-admin-api.md).
admin:
  # Prüfung der Upstream-Endpunkte von Deployments (SSRF-Schutz). Standard: nur https, keine
  # privaten/lokalen Ziele. Einträge: Hostname, Muster `*.lan`, IP-Adresse oder CIDR-Bereich.
  # http:// (ohne TLS) nur für diese Hosts, z. B. ["localhost", "ollama"]
  allow_insecure_upstreams: []
  # private/lokale Ziele (LAN, Loopback, Docker-Dienstnamen), z. B. ["192.168.0.0/16", "ollama"]
  allow_private_upstreams: []
  # Deployments mit `provider: mock` (eingebauter Echo-Anbieter für Demos/Smoke-Tests) erlauben.
  # false: Admin-API/GitOps lehnen sie ab, das Routing lässt vorhandene aus (F85).
  allow_mock: true
  # Admin-UI: Mock-Modus (Beispieldaten im Browser) anbieten; false blendet den Schalter aus und
  # ignoriert ?mock=1 (F135, empfohlen für Produktivinstallationen).
  ui:
    mock: true
    # Link vom Log-Explorer zum Tracing-System; {traceId} wird ersetzt (ohne = kein Link)
    # trace_url: "https://grafana.example.org/explore?traceId={traceId}"
  # Anmeldung an Admin-API und Admin-UI (§5).
  auth:
    # Bootstrap-Token für die Erstinstallation (AIGW_BOOTSTRAP_TOKEN oder Startausgabe):
    # "auto" = aus, sobald sich ein OIDC-Admin angemeldet hat oder ein Admin-API-Key mit
    # Rolle admin existiert; "on" = immer; "off" = nie. (Anführungszeichen wegen YAML 1.1.)
    bootstrap: "auto"
    # Login/Logout nur mit Audit-Eintrag in derselben Transaktion (F113, fail-closed).
    audit_required: true
    # Höchstlaufzeit von Admin-API-Keys (F87), z. B. 90d; ohne = unbegrenzt.
    # max_admin_key_lifetime: 90d
    session:
      max_age_secs: 28800        # 8 h ab Anmeldung
      idle_timeout_secs: 1800    # 30 min ohne Aktivität
    oidc:
      # Ohne issuer ist der OIDC-Login aus.
      # issuer: "https://idp.example.org/realms/acme"
      # client_id: aigw
      # Client-Secret nie hier: Datei oder Umgebungsvariable; ohne beides öffentlicher Client (PKCE).
      # client_secret_file: /run/secrets/aigw-oidc-secret
      client_secret_env: AIGW_OIDC_CLIENT_SECRET
      # redirect_url: "https://gateway.example.org/admin/auth/callback"
      scopes: [openid, profile, email]
      # Claim mit Gruppen; Punkte für verschachtelte Claims (z. B. realm_access.roles)
      groups_claim: groups
      group_roles: []
      #  - group: aigw-admins
      #    role: admin
      #  - group: acme-platform-leads
      #    role: team-admin
      #    organization: acme
      #    team: platform
      provision_users: true      # Nutzer mit Gruppenrolle beim ersten Login anlegen
      link_by_email: false       # F90: vorab angelegte Nutzer über bestätigte E-Mail verknüpfen
      # Identität = Issuer + Kennung (F90): profile generic (Claim sub) | entra (oid + tid-Prüfung)
      profile: generic
      # identity_claim: sub        # eigener Claim (Standard: sub bzw. oid bei entra)
      # tenant_id: "…"             # Pflicht bei profile: entra
      invite_ttl_secs: 604800    # Einladungslinks (POST /admin/api/v1/users/{name}/invitation)
      end_session: true          # Abmelden auch beim IdP (falls end_session_endpoint)
      # post_logout_redirect_url: "https://gateway.example.org/admin/"
      # ca_file: /etc/aigw/idp-ca.pem   # zusätzlich zu upstream.roots/upstream.ca_file
      cache_secs: 3600
      http_timeout_secs: 10
      clock_skew_secs: 60

# Limits je Key/Team/Organisation/Modellgruppe (docs/konzept/11-limits-und-budgets.md). Die
# Limits stehen an den Ressourcen; hier nur, wie der Proxy sie anwendet.
limits:
  # Ausgabe-Tokens für die Reservierung, wenn die Anfrage kein max_tokens enthält
  default_max_tokens: 4096
  # x-ratelimit-* bzw. anthropic-ratelimit-* auch bei Erfolg (bei 429 immer)
  response_headers: true

# Kosten und Budgets: Zeitzone der Kalender-Zeiträume (IANA-Name) und Abgleich mit der
# Datenbank (Tabelle budget_usage, instanzübergreifend).
billing:
  timezone: UTC
  budget_sync_ms: 1000

# Ereignis-Webhooks (Budget-Warnung/-Erschöpfung; docs/konzept/11-limits-und-budgets.md):
# asynchron, gepuffert, Wiederholung mit Backoff, im Cluster je Ereignis nur einmal
# (Tabelle event_dedup). Geheimnis nie als Klartext: credential (ProviderCredential-Feld),
# env oder file.
events:
  queue_capacity: 1024
  concurrency: 8
  retry_initial_ms: 1000
  retry_max_ms: 60000
  dedup: true
  webhooks: []
  # webhooks:
  #   - name: finance
  #     url: https://hooks.example.org/aigw
  #     events: [budget.warning, budget.exhausted]   # leer = alle
  #     secret: {credential: hooks, field: webhookSecret}
  #     timeout_ms: 5000
  #     max_attempts: 6

# Antwort-Cache (docs/konzept/14-cache.md). Wo gecacht wird (Ebene, Modus, Scope, TTL,
# Schwellen), legen Bindungen des Plugins `cache` fest; hier nur Speicher und Backends.
cache:
  enabled: true
  memory_max_bytes: 268435456   # RAM-LRU für exakte Treffer
  max_entry_bytes: 1048576
  max_ttl_secs: 604800
  # redis_url: redis://redis:6379/0   # optionale gemeinsame zweite Ebene (exakt)
  redis_key_prefix: "aigw:cache:"
  backend_timeout_ms: 250       # Redis/pgvector; Überschreitung = Cache-Miss
  replay_chunk_chars: 32        # simuliertes Chunking bei Wiedergabe als Stream
  semantic:
    backend: memory             # memory (eigener HNSW) | pgvector | redis (Redis Stack/Valkey Search)
    # embedding_model: text-embedding-3-small   # Modellgruppe des Gateways
    # dimensions: 1536          # Pflicht für pgvector/redis
    embed_timeout_ms: 2000
    max_entries: 100000
    max_bytes: 536870912
    hnsw: {m: 16, ef_construction: 200, ef_search: 64}
    persist: true               # memory: Warmstart aus der Datenbank (verschlüsselt)
    # pgvector_url: postgres://…  # Standard: store.url, falls Postgres
    # redis_url: redis://…        # Standard: cache.redis_url
