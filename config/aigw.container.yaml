#
# Standardkonfiguration im Container-Image (Dockerfile). Datenbank unter /data
# (Volume einhängen, beschreibbar für UID 65532). Master-Key per AIGW_MASTER_KEY
# oder als Datei (AIGW_SECRETS__MASTER_KEY_FILE=/run/secrets/…).

server:
  data:
    listen: "0.0.0.0:4000"
  control:
    listen: "0.0.0.0:4001"

store:
  url: "sqlite:///data/aigw.db?mode=rwc"
