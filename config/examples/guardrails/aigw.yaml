#
# Startkonfiguration für Guardrails/PII (docs/konzept/13-guardrails.md). Die Prüfungen selbst
# sind Plugin-Bindungen (resources.yaml). Payload-Logging höchstens maskiert.
store:
  url: "sqlite://aigw.db?mode=rwc"
observe:
  payload: masked
  payload_max_bytes: 65536
  retention:
    payload_days: 7
