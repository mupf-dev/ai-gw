#
# Alle Anbieterarten (docs/konzept/06-streaming-und-anbieter.md). Geheimnisse nur als Verweis
# (valueFrom env|file) – zur Apply-Zeit aufgelöst, verschlüsselt gespeichert.
#
#   aigw config apply -c config/examples/providers/aigw.yaml config/examples/providers/resources.yaml
#
# Benötigte Variablen bzw. Dateien:
#   AIGW_SECRET_OPENAI_API_KEY, AIGW_SECRET_ANTHROPIC_API_KEY, AIGW_SECRET_AZURE_API_KEY,
#   AIGW_SECRET_AZURE_TENANT_ID, AIGW_SECRET_AZURE_CLIENT_ID, AIGW_SECRET_AZURE_CLIENT_SECRET,
#   AIGW_SECRET_AWS_ACCESS_KEY_ID, AIGW_SECRET_AWS_SECRET_ACCESS_KEY, AIGW_SECRET_GEMINI_API_KEY,
#   AIGW_SECRET_MISTRAL_API_KEY, /run/secrets/vertex-service-account.json (Schlüsseldatei)
#
# Modellgruppen sind die Namen, die Clients als "model" schicken; Deployments sind die
# konkreten Ziele dahinter (mehrere je Gruppe = Lastverteilung/Fallback, docs/konzept/10-routing.md).

# --- OpenAI -----------------------------------------------------------------------------------
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: openai}
spec:
  provider: openai
  data:
    apiKey: {valueFrom: {env: AIGW_SECRET_OPENAI_API_KEY}}
---
apiVersion: aigw/v1alpha1
kind: ModelGroup
metadata: {name: gpt-4o}
spec:
  aliases: [gpt-4o-latest]
  routing: least-latency
  fallbacks:
    - modelGroup: claude-sonnet
      on: [rate-limit, unavailable]
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gpt-4o-openai}
spec:
  modelGroup: gpt-4o
  provider: openai
  providerModel: gpt-4o-2024-08-06
  credential: openai
  weight: 2
  capacity: {rpm: 500, tpm: 300000}

# --- Azure OpenAI (zweites Deployment derselben Gruppe) ----------------------------------------
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: azure-westeurope}
spec:
  provider: azure-openai
  data:
    apiKey: {valueFrom: {env: AIGW_SECRET_AZURE_API_KEY}}
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gpt-4o-azure}
spec:
  modelGroup: gpt-4o
  provider: azure-openai
  endpoint: https://acme-westeurope.openai.azure.com
  # Name des Azure-Deployments
  providerModel: gpt-4o-prod
  credential: azure-westeurope
  weight: 1
  settings:
    apiVersion: "2024-10-21"

# --- Azure OpenAI mit Entra ID (Service Principal mit Client-Secret) ---------------------------
# Alternativ clientCertificate (PEM: Zertifikat + privater RSA-Schlüssel) statt clientSecret.
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: azure-swedencentral-entra}
spec:
  provider: azure-openai
  data:
    tenantId: {valueFrom: {env: AIGW_SECRET_AZURE_TENANT_ID}}
    clientId: {valueFrom: {env: AIGW_SECRET_AZURE_CLIENT_ID}}
    clientSecret: {valueFrom: {env: AIGW_SECRET_AZURE_CLIENT_SECRET}}
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gpt-4o-azure-entra}
spec:
  modelGroup: gpt-4o
  provider: azure-openai
  endpoint: https://acme-swedencentral.openai.azure.com
  providerModel: gpt-4o-prod
  credential: azure-swedencentral-entra
  weight: 1
  priority: 1
  settings:
    apiVersion: "2024-10-21"
    auth: entraId
    # Standardwerte; für Sovereign Clouds z. B. https://login.microsoftonline.us und
    # https://cognitiveservices.azure.us/.default
    entraAuthority: https://login.microsoftonline.com
    entraScope: https://cognitiveservices.azure.com/.default

# --- Azure OpenAI mit Managed Identity (ohne gespeicherte Zugangsdaten) ------------------------
# Token vom Azure-Metadatendienst (IMDS) bzw. App Service (IDENTITY_ENDPOINT). Für Workload
# Identity (AKS) entraCredential: workloadIdentity – Tenant, Client-ID und Token-Datei kommen
# aus AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_FEDERATED_TOKEN_FILE.
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gpt-4o-azure-mi}
spec:
  modelGroup: gpt-4o
  provider: azure-openai
  endpoint: https://acme-norwayeast.openai.azure.com
  providerModel: gpt-4o-prod
  weight: 1
  priority: 1
  settings:
    apiVersion: "2024-10-21"
    auth: entraId
    entraCredential: managedIdentity
    # Benutzerzugewiesene Identität (weglassen = systemzugewiesen)
    entraClientId: 11111111-2222-3333-4444-555555555555

# --- Anthropic --------------------------------------------------------------------------------
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: anthropic}
spec:
  provider: anthropic
  data:
    apiKey: {valueFrom: {env: AIGW_SECRET_ANTHROPIC_API_KEY}}
---
apiVersion: aigw/v1alpha1
kind: ModelGroup
metadata: {name: claude-sonnet}
spec:
  aliases: [claude-sonnet-latest]
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: claude-sonnet-anthropic}
spec:
  modelGroup: claude-sonnet
  provider: anthropic
  providerModel: claude-sonnet-4-5
  credential: anthropic
  priority: 0

# --- AWS Bedrock (Fallback-Deployment derselben Gruppe, Priorität 1) --------------------------
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: aws-bedrock}
spec:
  provider: bedrock
  data:
    accessKeyId: {valueFrom: {env: AIGW_SECRET_AWS_ACCESS_KEY_ID}}
    secretAccessKey: {valueFrom: {env: AIGW_SECRET_AWS_SECRET_ACCESS_KEY}}
    # alternativ Bedrock-API-Key: apiKey
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: claude-sonnet-bedrock}
spec:
  modelGroup: claude-sonnet
  provider: bedrock
  # Modell-ID oder Inference-Profile-ID
  providerModel: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  credential: aws-bedrock
  priority: 1
  settings:
    region: eu-central-1

# --- Google Gemini API und Vertex AI ----------------------------------------------------------
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: gemini}
spec:
  provider: vertex
  data:
    apiKey: {valueFrom: {env: AIGW_SECRET_GEMINI_API_KEY}}
---
apiVersion: aigw/v1alpha1
kind: ProviderCredential
metadata: {name: vertex-sa}
spec:
  provider: vertex
  data:
    # Schlüsseldatei des Service-Accounts (JSON); project kommt aus project_id
    serviceAccountJson: {valueFrom: {file: /run/secrets/vertex-service-account.json}}
---
apiVersion: aigw/v1alpha1
kind: ModelGroup
metadata: {name: gemini-flash}
spec: {}
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gemini-flash-api}
spec:
  modelGroup: gemini-flash
  provider: vertex
  providerModel: gemini-2.5-flash
  credential: gemini
  settings:
    api: gemini
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: gemini-flash-vertex}
spec:
  modelGroup: gemini-flash
  provider: vertex
  providerModel: gemini-2.5-flash
  credential: vertex-sa
  settings:
    api: vertex
    location: europe-west4

