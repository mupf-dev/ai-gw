# --- Selbst betrieben: Ollama und vLLM (ohne Zugangsdaten) -------------------------------------
---
apiVersion: aigw/v1alpha1
kind: ModelGroup
metadata: {name: llama}
spec:
  routing: least-busy
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: llama-ollama}
spec:
  modelGroup: llama
  provider: ollama
  endpoint: http://ollama:11434
  providerModel: llama3.1:8b
---
apiVersion: aigw/v1alpha1
kind: Deployment
metadata: {name: llama-vllm}
spec:
  modelGroup: llama
  provider: vllm
  endpoint: http://vllm:8000/v1
  providerModel: meta-llama/Llama-3.1-8B-Instruct
  capacity: {rpm: 600}

# --- Preise (Kostenrechnung/Budgets; Abrechnungswährung, Festkomma) ----------------------------
---
apiVersion: aigw/v1alpha1
kind: Price
metadata: {name: gpt-4o-2024-08}
spec:
  provider: openai
  model: gpt-4o-2024-08-06
  validFrom: "2024-08-06T00:00:00Z"
  perMillionTokens: {input: "2.50", cachedInput: "1.25", output: "10"}
---
apiVersion: aigw/v1alpha1
kind: Price
metadata: {name: claude-sonnet-4-5}
spec:
  provider: anthropic
  model: claude-sonnet-4-5
  validFrom: "2025-09-29T00:00:00Z"
  perMillionTokens: {input: "3", cachedInput: "0.30", output: "15"}
