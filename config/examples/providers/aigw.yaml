#
# Startkonfiguration für das Anbieter-Beispiel (resources.yaml): Ollama und vLLM laufen im
# eigenen Netz ohne TLS und müssen ausdrücklich freigegeben werden (SSRF-Schutz,
# docs/betrieb/haertung.md). Freigaben so eng wie möglich halten.
store:
  url: "sqlite://aigw.db?mode=rwc"
admin:
  # http:// nur für diese Hosts
  allow_insecure_upstreams: ["ollama", "vllm"]
  # private Ziele (Docker-/Kubernetes-Dienstnamen, LAN)
  allow_private_upstreams: ["ollama", "vllm"]
  # Produktiv: keine Mock-Deployments
  allow_mock: false
