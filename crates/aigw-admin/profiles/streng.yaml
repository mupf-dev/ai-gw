#
# Guardrail-Profil „Streng“ (AIGW-86). Im Binary eingebettet; Änderungen am Inhalt erhöhen
# `version`.
name: streng
version: 3
title: Streng
summary: Wie Basis, aber Kreditkarten und Geheimnisse werden abgelehnt, externe Inhaltsprüfung, Payload-Logging höchstens maskiert.
description: |
  Für Bereiche mit vertraulichen oder regulierten Daten. Kreditkartennummern, API-Keys/Tokens
  und Zugangsdaten in URLs führen zur Ablehnung (Eingabe: 400 pii_detected; Ausgabe: 200 mit
  finish_reason content_filter) – sie sollen gar nicht erst verarbeitet werden. Weitere PII
  (E-Mail, Telefon, IBAN, deutsche Steuer-ID, Sozialversicherungs-, Ausweis- und Passnummern)
  werden maskiert. Die Prompt-Injection-Heuristik greift früher (Schwelle 0,8), die
  Größenlimits sind enger, Anfragen mit unsichtbaren Unicode-Zeichen (versteckte Anweisungen)
  werden abgelehnt. Ein Canary-Token im System-Prompt erkennt, wenn das Modell den
  System-Prompt ausgibt – die Antwort wird dann blockiert (200 mit content_filter). Diese
  Bindungen sind gesperrt (locked): untere Ebenen können sie nicht abschalten. Optional prüft content-safety Ein- und Ausgabe extern (Azure AI Content
  Safety, OpenAI Moderation oder ein Prüfmodell über eine Modellgruppe des Gateways) – dafür
  beim Anwenden Anbieter und Endpunkt bzw. Modellgruppe angeben. Payload-Logging wird auf
  höchstens „masked“ begrenzt (Organisation/Team: payloadModeMax). Bilder in Antworten, die
  auf fremde Domains zeigen, werden entfernt (link-guard): eingeschleuste Anweisungen können so
  keine Daten über automatisch geladene Bild-URLs abfließen lassen.
logging:
  payloadModeMax: masked
bindings:
  - note: Prompt-Injection-Heuristik (Schwelle 0,8), engere Größenlimits, unsichtbare Unicode-Zeichen ablehnen; gesperrt.
    spec:
      scope: {level: global}
      plugin: prompt-filter
      order: 10
      locked: true
      config:
        action: reject
        roles: [user, tool]
        injection: {threshold: 0.8, action: reject}
        limits: {maxMessages: 100, maxChars: 200000, maxMessageChars: 50000, action: reject}
        invisible: {action: reject}
  - note: Kreditkarten, API-Keys und URL-Zugangsdaten ablehnen, übrige PII maskieren; gesperrt.
    spec:
      scope: {level: global}
      plugin: pii
      order: 20
      locked: true
      config:
        action: mask
        direction: both
        categories:
          email: mask
          phone: mask
          iban: mask
          taxIdDe: mask
          socialSecurityDe: mask
          idCardDe: mask
          passportDe: mask
          creditCard: reject
          apiKey: reject
          urlCredentials: reject
  - note: Bilder zu fremden Domains aus Antworten entfernen (Schutz vor Datenabfluss über Links, AIGW-110); gesperrt.
    spec:
      scope: {level: global}
      plugin: link-guard
      order: 25
      locked: true
      config:
        images: block
        links: allow
        action: strip
  - note: System-Prompt-Leck erkennen (Canary-Token, stabil je Key und System-Prompt, damit Prompt-Caching der Anbieter greift) und die Antwort blockieren; gesperrt.
    spec:
      scope: {level: global}
      plugin: prompt-leak
      order: 90
      locked: true
      config:
        action: block
        canary: {rotation: stable}
  - note: Externe Inhaltsprüfung von Ein- und Ausgabe (gepuffert), Fehler des Dienstes lehnen ab (failMode closed). Nur mit Angaben beim Anwenden.
    requires: contentSafety
    spec:
      scope: {level: global}
      plugin: content-safety
      order: 30
      failMode: closed
      timeoutMs: 3000
      config:
        provider: azure
        direction: both
        outputMode: buffered
        action: reject
