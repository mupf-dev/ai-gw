#
# Preiskatalog der direkten Anbieter für Preisvorschläge (AIGW-85).
#
# Eigene, gepflegte Datei: Listenpreise in USD je 1 Mio. Tokens aus den öffentlichen Preisseiten der
# Anbieter (Quelle je Abschnitt), abgeglichen mit LiteLLM `model_prices_and_context_window.json` (MIT).
# Preise sind Fakten; aus fremden Dateien wird nichts übernommen. Pflege: scripts/price-catalog-check.py
# zeigt Abweichungen gegenüber LiteLLM.
#
# Felder je Modell: provider (Anbieterart wie Deployment.provider), model (providerModel), aliases
# (weitere Namen, z. B. Snapshots mit Datum), optional validFrom (JJJJ-MM-TT), perMillionTokens
# (input, cachedInput, cacheWrite, output, reasoning, audioInput, audioOutput, imageInput) und
# perRequest/perImage/perAudioMinute/perMillionCharacters – wie die Ressource `Price`.
# Gemini steht unter `vertex` (Gemini-API-Listenpreise; Vertex AI kann abweichen).
# Claude in Azure AI Foundry wird zu Anthropic-Listenpreisen abgerechnet (Marketplace) und nutzt
# daher die Einträge unter `anthropic`.
