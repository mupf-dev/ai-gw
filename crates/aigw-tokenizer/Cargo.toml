[package]
name = "aigw-tokenizer"
description = "Token-Zählung von ai-gw: eigene BPE für o200k_base/cl100k_base (Tabellen eingebettet oder zur Laufzeit geladen), HF-tokenizer.json (BPE/Unigram) und Heuristik mit Sprachfaktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
# Rangtabellen von OpenAI (siehe data/*.license und THIRD-PARTY.md) liegen im Crate; in das
# Binary gehen sie nur mit dem Feature `embedded-tokenizers` ein.
include = ["src/**", "data/**", "Cargo.toml"]

[features]
default = ["embedded-tokenizers"]
# Rangtabellen o200k_base/cl100k_base in das Binary einbetten (AIGW-95). Ohne dieses Feature
# lädt der Betreiber die `*.tiktoken`-Dateien zur Laufzeit (`tokenizer.ranks_dir`), sonst gilt
# die Heuristik.
embedded-tokenizers = []

[dependencies]
# SHA-256 der zur Laufzeit geladenen `*.tiktoken` (gleiche Krypto-Bibliothek wie TLS/Keyring).
aws-lc-rs.workspace = true
base64.workspace = true
# Generischer Split-Pre-Tokenizer aus tokenizer.json (Llama 3, Tekken …) braucht die
# Unicode-Kategorien (\p{L}, \p{Lu} …); regex-syntax liefert dieselben Tabellen für die
# handgeschriebenen o200k/cl100k-Pre-Tokenizer (gleiche Unicode-Version wie tiktoken/fancy-regex).
regex = { workspace = true, features = ["unicode-gencat"] }
regex-syntax.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "count"
harness = false
required-features = ["embedded-tokenizers"]

[lints]
workspace = true
