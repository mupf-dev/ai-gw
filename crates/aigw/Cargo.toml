[package]
name = "aigw"
description = "ai-gw: AI-Gateway (Gateway und Admin-API in einem Binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aigw"
path = "src/main.rs"

[dependencies]
aigw-admin.workspace = true
aigw-billing.workspace = true
aigw-cache.workspace = true
aigw-core.workspace = true
aigw-counters.workspace = true
aigw-observe.workspace = true
aigw-outbound.workspace = true
aigw-plugins.workspace = true
aigw-proxy.workspace = true
aigw-store.workspace = true
aigw-tokenizer.workspace = true
aigw-wasm = { workspace = true, optional = true }
aigw-webhook.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
# Eigene Accept-Schleife mit Verbindungsgrenze und Lese-Timeouts (S-32, AIGW-80).
hyper.workspace = true
# Download der tiktoken-Rangtabellen (AIGW-95).
http.workspace = true
hyper-util = { workspace = true, features = ["server-auto"] }
mimalloc = { workspace = true, optional = true }
rustls.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# mimalloc als globaler Allokator (AIGW-57, docs/betrieb/leistung.md); ohne dieses Feature
# (`--no-default-features`) gilt der System-Allokator.
default = ["mimalloc", "embedded-tokenizers", "wasm"]
mimalloc = ["dep:mimalloc"]
# Rangtabellen o200k_base/cl100k_base von OpenAI in das Binary einbetten (AIGW-95). Ohne dieses
# Feature lädt das Gateway sie zur Laufzeit aus `tokenizer.ranks_dir` (optional einmaliger
# Download mit `tokenizer.download_ranks`), sonst gilt die Heuristik. Build ohne Tabellen:
# `cargo build -p aigw --no-default-features --features mimalloc`.
embedded-tokenizers = ["aigw-tokenizer/embedded-tokenizers"]
# WASM-Plugins (AIGW-63, wasmtime): ohne dieses Feature sind Bindungen der Art `wasm` nur
# prüfbar, Aufrufe schlagen fehl (→ failMode).
wasm = ["dep:aigw-wasm"]

[dev-dependencies]
http-body-util.workspace = true

[lints]
workspace = true
