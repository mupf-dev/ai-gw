#
# Cargo-Workspace für ai-gw (AIGW-8). Versionen werden ausschließlich hier gepflegt;
# die Crates referenzieren nur `workspace = true`.

[workspace]
resolver = "3"
members = [
    "crates/aigw",
    "crates/aigw-admin",
    "crates/aigw-billing",
    "crates/aigw-cache",
    "crates/aigw-core",
    "crates/aigw-counters",
    "crates/aigw-jwt",
    "crates/aigw-mcp",
    "crates/aigw-observe",
    "crates/aigw-outbound",
    "crates/aigw-pii",
    "crates/aigw-plugins",
    "crates/aigw-providers",
    "crates/aigw-sigstore",
    "crates/aigw-proxy",
    "crates/aigw-store",
    "crates/aigw-tokenizer",
    "crates/aigw-wasm",
    "crates/aigw-webhook",
]
# Beispiel-/Test-Plugins werden für wasm32-wasip2 gebaut (eigene Workspaces).
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "FSL-1.1-ALv2"
authors = ["mupf-dev"]
repository = "https://github.com/mupf-dev/ai-gw"
publish = false

[workspace.dependencies]
aigw-admin = { path = "crates/aigw-admin" }
aigw-billing = { path = "crates/aigw-billing" }
aigw-cache = { path = "crates/aigw-cache" }
aigw-core = { path = "crates/aigw-core" }
aigw-counters = { path = "crates/aigw-counters" }
aigw-jwt = { path = "crates/aigw-jwt" }
aigw-sigstore = { path = "crates/aigw-sigstore" }
aigw-mcp = { path = "crates/aigw-mcp" }
aigw-observe = { path = "crates/aigw-observe" }
aigw-outbound = { path = "crates/aigw-outbound" }
aigw-pii = { path = "crates/aigw-pii" }
aigw-plugins = { path = "crates/aigw-plugins" }
aigw-providers = { path = "crates/aigw-providers" }
aigw-proxy = { path = "crates/aigw-proxy" }
aigw-store = { path = "crates/aigw-store" }
aigw-tokenizer = { path = "crates/aigw-tokenizer" }
aigw-wasm = { path = "crates/aigw-wasm" }
aigw-webhook = { path = "crates/aigw-webhook" }

# HTTP-Stack (E2): axum 0.8 auf hyper 1, tower, tokio.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "tracing"] }
http = "1.3"
http-body-util = "0.1.3"
hyper = { version = "1.12", default-features = false, features = ["client", "server", "http1", "http2"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
# TLS nur über rustls mit aws-lc-rs (kein OpenSSL, kein ring).
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

# Persistenz (E4): SQLite (gebündelt) Standard, Postgres optional. Ohne Compile-Zeit-Makros
# (kein DB-Zugriff beim Bauen), ohne SQLite-Erweiterungsladen.
# Getrennte Treiber mit nativen Typen (F7, AIGW-73): `json` (JSONB), `uuid`, `time` (TIMESTAMPTZ),
# siehe docs/konzept/02-datenmodell.md.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "migrate", "json", "uuid", "time"] }

# Admin-API: OpenAPI 3.1 aus Rust-Typen (E3: TS-Typen der UI werden daraus generiert).
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "uuid", "time"] }
# Eingebettete Admin-UI (ui/dist bzw. Fallback, siehe crates/aigw-admin/build.rs).
rust-embed = { version = "8.14", default-features = false, features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }

bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "client", "client-legacy", "http1", "http2"] }
# Upstream-TLS (AIGW-14): rustls/aws-lc-rs, ALPN h2+http/1.1, Mozilla-Wurzelzertifikate
# (webpki-roots, unabhängig vom Container-Image).
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
# System-CAs für `upstream.roots: system|both` (aigw-outbound, AIGW-72); OIDC-Login (AIGW-32):
# Base64url für JWS/PKCE, URL-Aufbau.
rustls-native-certs = "0.8.5"
# Mozilla-Wurzelzertifikate für `upstream.roots: webpki|both` (AIGW-72; ohnehin über hyper-rustls im Baum).
webpki-roots = "1.0.12"
# Sigstore-Prüfung (AIGW-106): Zertifikatsketten mit rustls-webpki (ohnehin über rustls im Baum).
rustls-webpki = { version = "0.103.17", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pki-types = "1.16"
base64 = "0.22.1"
url = "2.5.8"
# Eigener DNS-Resolver mit SSRF-Filter für ausgehende Webhooks (AIGW-61; ohnehin über hyper-util im Baum).
tower-service = "0.3.3"
# Mikro-Benchmarks (nur dev).
divan = "0.1.21"
# WASM-Plugins (AIGW-63): wasmtime mit Component Model, Cranelift und Pooling-Allocator;
# WASI nur Preview 2 (ohne Netz/Dateisystem-Freigaben, siehe aigw-wasm).
wasmtime = { version = "50.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "pooling-allocator", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }

# Exakter Antwort-Cache (AIGW-39): Schlüssel = BLAKE3 über normalisierte Anfrage (schnell,
# kryptografisch, CC0/Apache-2.0); ohne Rayon/Mmap.
blake3 = { version = "1.8", default-features = false, features = ["std"] }
# Tool-Inventar (AIGW-87): schneller, prozesszufällig geschlüsselter Fingerabdruck im RAM
# (ohnehin über hashbrown im Baum).
foldhash = { version = "0.2", default-features = false, features = ["std"] }

# Lock-freier Austausch des Konfigurations-Snapshots im Hot Path (§14).
arc-swap = "1.7"
# Zähler (AIGW-29): geshardete Map für das lokale Backend, async-Trait für dyn-fähige
# Backends, Redis-Client (redis-rs: Tokio, rustls/aws-lc-rs, ConnectionManager, EVALSHA).
async-trait = "0.1.89"
dashmap = "6.1"
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "script"] }

clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
# Payload-Maskierung (AIGW-43): ohne Unicode-Tabellen außer \b/\w (unicode-perl).
regex = { version = "1.12", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# Unicode-Kategorietabellen für die Pre-Tokenizer von aigw-tokenizer (AIGW-71; ohnehin über regex im Baum).
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode-gencat", "unicode-perl"] }
# Guardrails (AIGW-37): Wort-/Phrasenlisten des Prompt-Filters (ohnehin Abhängigkeit von regex).
aho-corasick = { version = "1.1", default-features = false, features = ["std", "perf-literal"] }
# Spracherkennung für das Plugin `language` (AIGW-114), MIT; zieht nur ahash/zerocopy (MIT/Apache/BSD) nach.
whatlang = { version = "0.16.4", default-features = false }
# Structured Output (AIGW-113): JSON-Schema-Prüfung (MIT); ohne Nachladen externer Schemas
# (resolve-http/-file aus, kein reqwest) und ohne idna.
jsonschema = { version = "0.60.2", default-features = false }
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.17"
# Konfiguration und GitOps-Ressourcen in YAML (E7): reiner Rust-Parser ohne unsafe-C,
# Auswahl begründet in docs/konzept/02-datenmodell.md.
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize", "serialize"] }
time = { version = "0.3.47", default-features = false, features = ["std", "serde", "formatting", "parsing"] }
# Budget-Zeiträume in konfigurierbarer Zeitzone (AIGW-31): IANA-Zeitzonen mit eingebetteter
# tzdb (Container-Images ohne /usr/share/zoneinfo), reines Rust.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Rotation des JSON-Lines-Exports (F31): gzip der rotierten Dateien, reines Rust (miniz_oxide).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Speicherverwaltung des Binarys (AIGW-57): glibc-malloc kostete unter Last ≈ 17 % der
# Gateway-CPU (Arena-Sperren, _int_malloc/_int_free); mimalloc (MIT, C) ist der etablierte
# Ersatz. Messung und Begründung: docs/betrieb/leistung.md.
mimalloc = { version = "0.1.46", default-features = false }
# IDs: UUIDv7 (zeitlich sortierbar, gut für B-Baum-Indizes).
uuid = { version = "1.18", default-features = false, features = ["std", "v7", "serde"] }
# Krypto (AES-256-GCM, SHA-256, Zufall) über denselben Provider wie rustls.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json", "registry"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Release-Profil auf Effizienz im Hot Path: thin-LTO (guter Kompromiss aus Laufzeit und
# Bauzeit), eine Codegen-Unit, panic = "abort" (kein Unwinding-Code; ein Panic beendet den
# Prozess und der Supervisor startet neu – Handler dürfen daher nicht panicen, siehe Lints).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
