#
# Einzelinstanz mit SQLite (Test, kleine Installationen). Datenbank im Volume /data.
#   mkdir -p secrets && docker run --rm ai-gw:dev keygen > secrets/aigw-master-key
#   sudo chown 65532:65532 secrets/aigw-master-key && sudo chmod 0400 secrets/aigw-master-key
#   docker compose -f docker-compose.sqlite.yaml up -d

name: aigw-sqlite

services:
  aigw:
    image: ${AIGW_IMAGE:-ai-gw:dev}
    restart: unless-stopped
    environment:
      AIGW_SECRETS__MASTER_KEY_FILE: /run/secrets/aigw-master-key
      AIGW_BOOTSTRAP_TOKEN: ${AIGW_BOOTSTRAP_TOKEN:-}
      # tiktoken-Rangtabellen (nicht im Image, AIGW-92) liegen im Volume unter /data/tiktoken:
      # einmalig `docker compose run --rm aigw tokenizer fetch` oder Download beim Start
      # erlauben (AIGW_TOKENIZER_DOWNLOAD=true in .env); sonst Token-Schätzung (Heuristik).
      AIGW_TOKENIZER__DOWNLOAD_RANKS: ${AIGW_TOKENIZER_DOWNLOAD:-false}
    secrets:
      - aigw-master-key
    volumes:
      - aigw-data:/data
    ports:
      - "127.0.0.1:${AIGW_DATA_PORT:-4000}:4000"
      - "127.0.0.1:${AIGW_CONTROL_PORT:-4001}:4001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

secrets:
  aigw-master-key:
    file: ./secrets/aigw-master-key

volumes:
  aigw-data:
