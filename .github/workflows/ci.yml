#
# CI für Rust und UI: bei Pull Requests, Pushes auf main, manuell (workflow_dispatch) und als
# wiederverwendbarer Workflow aus .github/workflows/release.yml (workflow_call, Tags v*).
# Der teure Image-Job (amd64 + arm64, AIGW-91) läuft nur manuell; beim Release baut und testet
# release.yml die Images selbst (scripts/release-build.sh).
# Die eigentliche Logik steckt in scripts/check.sh – derselbe Einstieg wie auf der Buildbox.
# Härtung: Actions auf Commit-SHAs gepinnt (Tag als Kommentar), minimale Rechte,
# keine persistierten Checkout-Credentials.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      images:
        description: "Container-Images amd64 + arm64 bauen und testen"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      images:
        description: "Container-Images amd64 + arm64 bauen und testen (arm64 quer kompiliert, Smoke unter QEMU)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AIGW_STRICT: "1"

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12"
      - name: Werkzeuge (rustup-Toolchain, cargo-deny, reuse)
        run: scripts/setup-tools.sh
      - name: Prüfungen
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/bin:$PATH"
          scripts/check.sh
      # Lizenzübersicht (AIGW-91): THIRD-PARTY.md muss zu Cargo.lock und pnpm-lock.yaml passen
      # (ui/node_modules hat check.sh installiert). Zulässige Lizenzen prüft cargo-deny oben.
      - name: Drittanbieter-Lizenzen (THIRD-PARTY.md aktuell?)
        run: |
          . "$HOME/.cargo/env"
          scripts/third-party.sh --check

  manifests:
    name: Kubernetes-Manifeste und Helm-Chart (kubeconform)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kustomize, helm lint/template + kubeconform
        run: scripts/k8s-check.sh

  images:
    name: Container-Images (amd64 + arm64)
    if: inputs.images
    needs: [check, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Baut beide Architekturen (arm64 quer kompiliert, kein QEMU für den Compiler) und
      # startet danach je Image scripts/container-smoke.sh; arm64 läuft dabei unter QEMU.
      - name: Bauen + Smoke
        env:
          TAG: ci
          SMOKE: "1"
          SAVE_DIR: dist
        run: scripts/build-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-gw-images
          path: dist/*.tar.gz
          retention-days: 7
